name: Build master and update lambda

on:
  push:
    branches: master

jobs:
  build-lambda:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Get secrets
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "924edbf1-0c1f-409b-b948-da0322a3b737"
          project-slug: "aws"
          env-slug: "prod"

      - name: Get secrets
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "a8dda831-0ca0-4ddb-bd07-15ccb8d10396"
          project-slug: "publish"
          env-slug: "prod"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        env:
          GITHUB_APP_CREATE_TAGS_CLIENT_ID: ${{ env.GITHUB_APP_CREATE_TAGS_CLIENT_ID }}
          GITHUB_APP_CREATE_TAGS_PRIVATE_KEY: ${{ env.GITHUB_APP_CREATE_TAGS_PRIVATE_KEY }}
        with:
          client-id: ${{ env.GITHUB_APP_CREATE_TAGS_CLIENT_ID }}
          private-key: ${{ env.GITHUB_APP_CREATE_TAGS_PRIVATE_KEY }}
          owner: Stock-Trek

      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout algorithm-runner
        uses: actions/checkout@v5
        with:
          repository: Stock-Trek/algorithm-runner
          path: algorithm-runner
          ref: v0.3.0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Get versions and create image-tag
        id: image-tag
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          VERSION_ALGORITHM_COMPILER=$(cargo pkgid | sed 's|.*#||; s|.*:||; s|^v||')
          VERSION_ALGORITHM_RUNNER=$(cargo pkgid --manifest-path algorithm-runner/Cargo.toml | sed 's|.*#||; s|.*:||; s|^v||')
          VERSIONED="compiler_${VERSION_ALGORITHM_COMPILER}_runner_${VERSION_ALGORITHM_RUNNER}"
          IMAGE_PREFIX="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/algorithm-compiler"
          echo "image-master=${IMAGE_PREFIX}:${VERSIONED}" >> $GITHUB_OUTPUT
          echo "image-versioned=${IMAGE_PREFIX}:${VERSIONED}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ROLE_UPDATE_LAMBDA_COMPILE_RUST: ${{ env.AWS_ROLE_UPDATE_LAMBDA_COMPILE_RUST }}
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_UPDATE_LAMBDA_COMPILE_RUST }}"
          role-session-name: "algorithm-compiler-${{ github.run_id }}"
          retry-max-attempts: 3
          mask-aws-account-id: true

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx (required for caching)
        uses: docker/setup-buildx-action@v4

      - name: Build and push with cache
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image-tag.outputs.image-master }}
            ${{ steps.image-tag.outputs.image-versioned }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Update lambda to use latest image from master
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          aws lambda update-function-code \
            --function-name stock-trek-compile-rust \
            --image-uri "${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/algorithm-compiler:master"
