[package]
name = "algorithm-compiler"
version = "0.2.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
aws-smithy-types = "1"
flate2 = "1"
lambda_runtime = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
