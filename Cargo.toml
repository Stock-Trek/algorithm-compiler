[package]
name = "algorithm-compiler"
version = "0.2.0"
edition = "2024"

[dependencies]
aws-config = "1.8.16"
aws-sdk-dynamodb = "1.127.0"
aws-sdk-s3 = "1.130.0"
aws-smithy-types = "1.4.7"
lambda_runtime = "1.1.3"
serde = { version = "1.0.149", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.0", features = ["v4", "fast-rng"] }
